name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets the build itself (PC + Android) be smoke-tested from a branch — e.g. to verify a
  # Gradle/build.gradle fix actually compiles in real CI before cutting a real version tag —
  # without publishing a GitHub Release, registering anything on the cloud admin, or deploying
  # to Railway. The publish/deploy-cloud jobs below are gated to real tag pushes only
  # (startsWith(github.ref, 'refs/tags/')), so a manual dispatch run is fully non-destructive.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pc:
    name: Build PC installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bus2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bus2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync version from tag
        shell: bash
        run: |
          # GITHUB_REF_NAME is the branch name (e.g. "main"), not a version, on a manual
          # workflow_dispatch smoke-test run (see the `on:` block above) — npm pkg set requires
          # a valid semver, so fall back to a harmless placeholder rather than fail outright.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-test"
          fi
          npm pkg set version="$VERSION"
          npm pkg set version="$VERSION" --prefix cloud

      - name: Build PC release
        run: npm run build:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_CLOUD_URL: ${{ secrets.ADKERALA_CLOUD_URL }}

      - name: Upload PC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-release
          path: |
            bus2/release/*.exe
            bus2/release/latest.yml

  build-android:
    name: Build Android display APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bus2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bus2/package-lock.json

      # 21, not 17 — Capacitor's own capacitor-android library module targets Java 21
      # (compileReleaseJavaWithJavac failed with "invalid source release: 21" against JDK 17).
      # Matches what Android Studio actually builds with locally: its bundled JBR is JDK
      # 21-based, which is why this worked there and not against an explicit JDK 17 here.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK (pinned — must match display/android/app/build.gradle's ndkVersion)
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install dependencies
        run: npm ci

      # Same download this project's README documents as a one-time manual step
      # (display/LIBNODE-SETUP.md) — scripted here so CI doesn't depend on a human having done
      # it. Version pinned to match what server/androidMain.js and this repo's contributors use
      # locally; bump both places together if the pinned Node version ever changes.
      - name: Download libnode (nodejs-mobile-android)
        run: |
          curl -fsSL -o /tmp/nodejs-mobile-android.zip \
            https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          mkdir -p /tmp/nodejs-mobile-android
          unzip -q /tmp/nodejs-mobile-android.zip -d /tmp/nodejs-mobile-android
          mkdir -p display/android/app/libnode
          cp -r /tmp/nodejs-mobile-android/include display/android/app/libnode/include
          cp -r /tmp/nodejs-mobile-android/bin display/android/app/libnode/bin

      - name: Sync version from tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-test"
          fi
          npm pkg set version="$VERSION"

      - name: Build web + embedded server bundle
        run: npm run build:display-bundle
        env:
          VITE_CLOUD_URL: ${{ secrets.ADKERALA_CLOUD_URL }}

      # capacitor-cordova-android-plugins/ is generated, not committed (correctly gitignored —
      # same as the sibling bus2/android and bus2/cloud/web/android projects) — regenerated by
      # `cap sync`, which local Android Studio builds get for free (already run once when the
      # project was first opened) but this fresh CI checkout never does on its own. Caught by an
      # actual CI run failing with "Could not read script .../cordova.variables.gradle" — this
      # step is the real fix, not a workaround.
      - name: cap sync (regenerate capacitor-cordova-android-plugins/)
        working-directory: bus2/display
        run: |
          npm ci
          npx cap sync android

      - name: Decode release keystore
        # `secrets` isn't allowed inside a step's `if:` condition (only env: and a few other
        # places) — real GitHub Actions schema error caught by actionlint, not a guess. So the
        # secret is routed through env: here instead, and the script itself decides whether
        # there's anything to decode.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > display/android/app/release.keystore
          else
            echo "No ANDROID_RELEASE_KEYSTORE_BASE64 secret set — building an unsigned APK"
          fi

      - name: Build signed release APK
        working-directory: bus2/display/android
        env:
          # Only set at all when the keystore secret exists — build.gradle's hasReleaseSigning
          # check treats an empty/unset value as "no signing", producing an unsigned APK instead
          # of a broken signingConfig pointing at a file that was never decoded.
          ANDROID_RELEASE_STORE_FILE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          # build.gradle parses this into numeric versionCode parts (verParts[0] as Integer,
          # etc.) — a branch name like "main" would throw there, not just fail gracefully, on a
          # workflow_dispatch smoke-test run (see the `on:` block above). Use a real dotted
          # version in that case so the Gradle build actually exercises the same version-parsing
          # path a real release does, instead of skipping it.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export ADKERALA_ANDROID_VERSION="${GITHUB_REF_NAME#v}"
          else
            export ADKERALA_ANDROID_VERSION="0.0.0"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease

      # build.gradle's splits.abi produces one APK per ABI (app-<abi>-release.apk — see
      # build.gradle's splits comment for why: the fleet spans multiple chipsets, and one
      # universal APK bundling every ABI's native libraries was ~3x the necessary download size
      # for any single device) instead of a single app-release.apk. Rename each into
      # AdKeralaDisplay-<version>-<abi>.apk — register-android-release.mjs's --apk-dir mode
      # depends on that exact naming to discover and register every ABI variant.
      - name: Rename APKs (one per ABI)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-upload
          shopt -s nullglob
          apks=(display/android/app/build/outputs/apk/release/app-*-release.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No split APKs found under app/build/outputs/apk/release/ — build failed silently?" >&2
            exit 1
          fi
          for f in "${apks[@]}"; do
            base=$(basename "$f")
            abi="${base#app-}"
            abi="${abi%-release.apk}"
            cp "$f" "release-upload/AdKeralaDisplay-${VERSION}-${abi}.apk"
          done
          ls -la release-upload/

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: bus2/release-upload/*.apk

  publish:
    name: GitHub Release + cloud register
    needs: [build-pc, build-android]
    # build-android is new and has more moving parts (NDK, a large external download, signing
    # secrets) than the PC pipeline this sits alongside — a failure there must never block PC
    # releases, which shipped reliably before this existed. `if: always()` bypasses the default
    # "only run if all needs succeeded" gate, so the explicit build-pc result check below is
    # doing the real gating; build-android's result is deliberately not checked here.
    # && startsWith(github.ref, 'refs/tags/') keeps this from firing on a manual workflow_dispatch
    # smoke-test run (see the `on:` block above) — a dispatch run only needs build-pc/build-android
    # to succeed or fail, never a real GitHub Release / cloud registration.
    if: ${{ always() && needs.build-pc.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download PC artifacts
        uses: actions/download-artifact@v4
        with:
          name: pc-release
          path: artifacts/pc

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        continue-on-error: true # build-android may not have produced one — see note above
        with:
          name: android-release
          path: artifacts/android

      - name: Prepare release files
        run: |
          mkdir -p release-upload
          cp artifacts/pc/*.exe release-upload/ 2>/dev/null || true
          cp artifacts/pc/latest.yml release-upload/ 2>/dev/null || true
          cp artifacts/android/*.apk release-upload/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-upload/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Register releases on cloud admin
        working-directory: bus2
        env:
          # Force the raw Railway URL for this server-to-server call, not the
          # ADKERALA_CLOUD_URL secret (adkerala.com) — that domain sits behind
          # Cloudflare, which challenges/blocks non-browser clients like this
          # (confirmed via .github/workflows/diagnose-cloud-auth.yml: identical
          # request gets a clean 401 via Railway's raw URL but a Cloudflare
          # challenge page via the custom domain). Bus PCs default to the same
          # raw URL for their own API traffic — see kiosk/installEnv.cjs.
          ADKERALA_CLOUD_URL: https://adkeralav1-production.up.railway.app
          ADKERALA_ADMIN_KEY: ${{ secrets.ADKERALA_ADMIN_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$ADKERALA_ADMIN_KEY" ]; then
            echo "Skipping cloud register — add ADKERALA_ADMIN_KEY repo secret"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          PC_FILE=$(ls ../release-upload/*.exe 2>/dev/null | head -1)
          PC_NAME=$(basename "$PC_FILE")
          SHA512=""
          SIZE=""
          if [ -f ../release-upload/latest.yml ]; then
            SHA512=$(grep -E '^sha512:' ../release-upload/latest.yml | head -1 | awk '{print $2}')
            SIZE=$(grep -E 'size:' ../release-upload/latest.yml | head -1 | awk '{print $2}')
          fi
          node scripts/register-release.mjs \
            --cloud-url "$ADKERALA_CLOUD_URL" \
            --admin-key "$ADKERALA_ADMIN_KEY" \
            --version "$VERSION" \
            --pc-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${PC_NAME}" \
            --sha512 "$SHA512" \
            --size "$SIZE"

          # One APK per ABI now (see build.gradle's splits.abi / release.yml's "Rename APKs (one
          # per ABI)" step) — --apk-dir mode discovers every AdKeralaDisplay-<version>-<abi>.apk
          # in the directory, computes each one's sha256 itself, and registers all of them as
          # variants in one call so a device downloads only the build matching its own chipset.
          if ls ../release-upload/AdKeralaDisplay-*.apk >/dev/null 2>&1; then
            node scripts/register-android-release.mjs \
              --cloud-url "$ADKERALA_CLOUD_URL" \
              --admin-key "$ADKERALA_ADMIN_KEY" \
              --version "$VERSION" \
              --apk-dir ../release-upload \
              --repo "$GITHUB_REPOSITORY" \
              --tag "$GITHUB_REF_NAME"
          else
            echo "No Android APKs in this release — skipping Android registration"
          fi

  deploy-cloud:
    name: Deploy cloud to Railway
    runs-on: ubuntu-latest
    # Real tag pushes only — never deploy to production Railway from a manual workflow_dispatch
    # smoke-test run (see the `on:` block above).
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Sync cloud version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set version="$VERSION"
        working-directory: bus2/cloud

      - name: Deploy cloud to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Skipping Railway deploy — add RAILWAY_TOKEN repo secret"
            exit 0
          fi
          npm install -g @railway/cli
          cd bus2/cloud && railway up --service adkeralav1
