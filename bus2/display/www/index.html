<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AdKerala Display</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1020;
    color: #e7ebff;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { text-align: center; opacity: 0.85; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #6ea8ff; display: inline-block; margin: 0 4px;
    animation: pulse 1.2s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  p { margin-top: 16px; font-size: 14px; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <!--
    This page is only ever shown for the few seconds it takes the embedded local server
    (started in MainActivity, see android/app/src/main/java/com/adkerala/display/MainActivity.java)
    to come up. Once it answers, MainActivity navigates this WebView away from here to
    http://127.0.0.1:<port>/display?kiosk=1&autofs=1 — the real passenger-display SPA, served
    by the embedded server exactly like the PC kiosk app serves it today. Nothing here talks
    to that server; it's a static splash bundled into the APK via capacitor.config.ts's webDir.
  -->
  <div class="wrap">
    <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <p>Starting AdKerala Display…</p>
  </div>
</body>
</html>
